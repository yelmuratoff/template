name: base_starter
description: >
  Highly scalable Flutter starter kit, designed with an optimal predefined structure 
  and inclusive of libraries that are widely applicable in numerous use cases.
publish_to: "none"
version: 0.0.1+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  # Flutter SDK
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # BLoC
  flutter_bloc: ^9.1.0
  bloc: ^9.0.0
  bloc_concurrency: ^0.3.0

  # Networking
  dio: ^5.6.0

  # Persisting
  shared_preferences: ^2.3.2
  drift: ^2.19.1
  sqlite3_flutter_libs: ^0.6.0+eol
  flutter_secure_storage: ^10.0.0

  # Logging
  ispect: 5.2.0-dev.19
  ispectify_dio: 5.2.0-dev.19
  ispectify_bloc: 5.2.0-dev.19

  # Utils
  meta: ^1.16.0
  clock: ^1.1.1
  path: ^1.9.0
  path_provider: ^2.1.4
  equatable: ^2.0.5
  package_info_plus: ^10.1.0

  # UI
  ui:
    path: packages/ui
  gap: ^3.0.1
  flutter_easyloading: ^3.0.5
  auto_size_text: ^3.0.0
  iconsax_plus: ^1.0.0

  # Routing
  octopus: ^0.0.9

  # Others
  provider: ^6.1.2
  envied: ^1.3.0

dev_dependencies:
  # Testing
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  checks: ^0.3.0
  fake_async: ^1.3.1

  # Lints
  custom_lint: ^0.8.0
  pyramid_lint: ^2.3.0

  # Utils
  flutter_gen_runner: ^5.14.0
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.14.0

  # Flavors
  flutter_flavorizr: ^2.2.3

  # Codegen
  drift_dev: ^2.29.0
  build_runner: ^2.7.0
  envied_generator: ^1.3.0

flutter:
  uses-material-design: true

  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
    - .env

flutter_gen:
  output: lib/src/core/assets/generated
  line_length: 80

flutter_launcher_icons: # dart pub run flutter_launcher_icons
  #  image_path: "assets/images/icon-128x128.png"
  image_path_android: "assets/images/launcher.png"
  image_path_ios: "assets/images/launcher.png"
  android: true # can specify file name here e.g. "ic_launcher"
  ios: true # can specify file name here e.g. "My-Launcher-Icon"
  # adaptive_icon_background: "assets/images/christmas-background.png" # only available for Android 8.0 devices and above
  # adaptive_icon_foreground: "assets/images/icon-foreground-432x432.png" # only available for Android 8.0 devices and above
  min_sdk_android: 21 # android min sdk min:16, default 21
  remove_alpha_ios: true

  # web:
  #   generate: true
  #   image_path: "assets/images/launcher.png"
  #   # background_color: "#hexcode"
  #   # theme_color: "#hexcode"

  # windows:
  #   generate: true
  #   image_path: "assets/images/launcher.png"
  #   icon_size: 48 # min:48, max:256, default: 48

  # macos:
  #   generate: true
  #   image_path: "assets/images/launcher.png"
